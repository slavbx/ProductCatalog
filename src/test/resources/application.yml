server:
  servlet:
    context-path: /productcatalog
spring:
  datasource:
    name: test_db
    username: test
    password: test
    driver-class-name: org.postgresql.Driver
    current-schema: pc_schema
  #    dbcp2:
  #      default-schema: productcatalog
  liquibase:
    user: test
    password: test
    default-schema: pc_service_schema
    change-log: /db/changelog/changelog-master.yaml
    enabled: true
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate.default_schema: pc_schema